name: Setup Databricks CLI

description: |
  Install the Databricks CLI on your GitHub Actions runner. By default installs a release build; use snapshot: true to install the latest snapshot build.

inputs:
  version:
    description: 'The version of the Databricks CLI to download (defaults to the version bundled with this action revision).'
    required: false

  snapshot:
    description: 'Install a snapshot build (set to "true" to enable).'
    required: false

  branch:
    description: '(snapshot build only) The branch to download the snapshot build for.'
    required: false

runs:
  using: "composite"
  steps:
    - name: Download snapshot build
      if: ${{ inputs.snapshot == 'true' }}
      shell: bash
      run: bash $GITHUB_ACTION_PATH/setup_snapshot.sh
      env:
        GH_REPO: databricks/cli
        BRANCH: ${{ inputs.branch }}

    - name: Download release build
      if: ${{ inputs.snapshot != 'true' }}
      shell: bash
      run: bash $GITHUB_ACTION_PATH/setup_release.sh
      env:
        VERSION: ${{ inputs.version }}

    - name: Get Databricks CLI version
      shell: bash
      run: databricks version --output json

author: Databricks

branding:
  icon: download
  color: blue
