name: test

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

# Note: all jobs in this workflow run on GitHub-hosted runners.
# None of them need authenticated (token) access to the repository.
#
# If this were to change and they do need authenticated access, make sure to use the
# self-hosted runners listed on the "Settings" -> "Actions" -> "Runners" page.
#
jobs:
  action_with_defaults:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli
          persist-credentials: false

      - uses: ./setup-cli

      - run: databricks version
        shell: bash

      - run: ./setup-cli/assert/version.sh "$(cat ./setup-cli/VERSION)"
        shell: bash

      - run: ./setup-cli/assert/clean.sh
        shell: bash

  action_with_version:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli
          persist-credentials: false

      - uses: ./setup-cli
        with:
          version: 0.200.0

      - run: databricks version
        shell: bash

      - run: ./setup-cli/assert/version.sh 0.200.0
        shell: bash

      - run: ./setup-cli/assert/clean.sh
        shell: bash

  action_twice:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli
          persist-credentials: false

      # Each invocation must select its requested version on PATH.
      - uses: ./setup-cli
        with:
          version: 0.200.0

      - run: ./setup-cli/assert/version.sh 0.200.0
        shell: bash

      - uses: ./setup-cli

      - run: ./setup-cli/assert/version.sh "$(cat ./setup-cli/VERSION)"
        shell: bash

      - run: ./setup-cli/assert/clean.sh
        shell: bash

  install:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli
          persist-credentials: false

      - name: Test assertion helpers offline
        run: bash ./setup-cli/assert/self-test.sh
        shell: bash

      - run: env
        shell: bash

      - name: Assert databricks CLI is not already installed
        run: ./setup-cli/assert/not-installed.sh
        shell: bash

      - run: ./setup-cli/install.sh
        shell: bash

      - run: databricks version
        shell: bash

      - name: Assert the version of the CLI installed
        run: ./setup-cli/assert/version.sh "$(cat ./setup-cli/VERSION)"
        shell: bash

      - name: Assert installation path is /usr/local/bin for non-windows platforms
        run: ./setup-cli/assert/path.sh /usr/local/bin/databricks
        if: matrix.os != 'windows-latest'
        shell: bash

      - name: Assert installation path is /c/Windows for windows platforms
        if: matrix.os == 'windows-latest'
        run: ./setup-cli/assert/path.sh /c/Windows/databricks
        shell: bash


  install-dbr:
    # All DBR images are built on top of Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli
          persist-credentials: false

      # When run on DBR, the installation scripts installs the CLI to ~/bin. Add
      # it to $PATH to make assertions work.
      - run: echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Assert databricks CLI is not already installed
        run: ./setup-cli/assert/not-installed.sh
        shell: bash

      - name: Install the CLI
        run: ./setup-cli/install.sh
        shell: bash
        env:
          DATABRICKS_RUNTIME_VERSION: value-does-not-matter

      - name: Run the CLI
        run: databricks version
        shell: bash

      - name: Assert the version of the CLI installed
        run: ./setup-cli/assert/version.sh "$(cat ./setup-cli/VERSION)"
        shell: bash

      - name: Assert installation path is ~/bin
        run: ./setup-cli/assert/path.sh ~/bin/databricks
        shell: bash

  curl:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli
          persist-credentials: false

      - name: Assert databricks CLI is not already installed
        run: ./setup-cli/assert/not-installed.sh
        shell: bash

      - run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/${{ github.sha }}/install.sh | sh
        shell: bash

      - run: databricks version
        shell: bash

      - name: Assert the version of the CLI installed
        run: ./setup-cli/assert/version.sh "$(cat ./setup-cli/VERSION)"
        shell: bash

      - name: Assert installation path is /usr/local/bin for non-windows platforms
        run: ./setup-cli/assert/path.sh /usr/local/bin/databricks
        if: matrix.os != 'windows-latest'
        shell: bash

      - name: Assert installation path is /c/Windows for windows platforms
        if: matrix.os == 'windows-latest'
        run: ./setup-cli/assert/path.sh /c/Windows/databricks
        shell: bash

  curl-dbr:
    # All DBR images are built on top of Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli
          persist-credentials: false

      # When run on DBR, the installation scripts installs the CLI to ~/bin. Add
      # it to $PATH to make assertions work.
      - run: echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Assert databricks CLI is not already installed
        run: ./setup-cli/assert/not-installed.sh
        shell: bash

      - run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/${{ github.sha }}/install.sh | sh
        shell: bash
        env:
          DATABRICKS_RUNTIME_VERSION: value-does-not-matter

      - run: databricks version
        shell: bash

      - name: Assert the version of the CLI installed
        run: ./setup-cli/assert/version.sh "$(cat ./setup-cli/VERSION)"
        shell: bash

      - name: Assert installation path is ~/bin
        run: ./setup-cli/assert/path.sh ~/bin/databricks
        shell: bash

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get install shellcheck
        shell: bash

      - name: Validate workflow syntax and expressions
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          lint_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$lint_dir/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $lint_dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          # Script ShellCheck runs below. Legacy publication workflows have
          # existing inline ShellCheck warnings and a custom runner label.
          "$lint_dir/actionlint" -shellcheck= \
            -ignore 'label "linux-ubuntu-latest" is unknown' \
            ./setup-cli/.github/workflows/*.yml

      - name: Run shellcheck
        run: shellcheck ./setup-cli/*.sh ./setup-cli/assert/*.sh
        shell: bash
