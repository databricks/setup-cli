name: test

on:
  pull_request:
    types: [opened, synchronize]

  push:
    branches: [main]

  workflow_dispatch:

# Note: all jobs in this workflow run on GitHub-hosted runners.
# None of them need authenticated (token) access to the repository.
#
# If this were to change and they do need authenticated access, make sure to use the
# self-hosted runners listed on the "Settings" -> "Actions" -> "Runners" page.
#
jobs:
  checksum_verification:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: bash assert/checksums.sh
        shell: bash

  action_with_defaults:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli

      - uses: ./setup-cli

      - run: databricks version
        shell: bash

      - run: ./setup-cli/assert/version.sh $(cat ./setup-cli/VERSION)
        shell: bash

      - run: ./setup-cli/assert/clean.sh
        shell: bash

  action_with_version:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli

      - uses: ./setup-cli
        with:
          version: 0.200.0

      - run: databricks version
        shell: bash

      - run: ./setup-cli/assert/version.sh 0.200.0
        shell: bash

      - run: ./setup-cli/assert/clean.sh
        shell: bash

  action_twice:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli

      # Confirm the action can be invoked more than once in the same job.
      - uses: ./setup-cli

      - run: echo $(which databricks)
        shell: bash

      - uses: ./setup-cli

      - run: echo $(which databricks)
        shell: bash

      - run: databricks version
        shell: bash

      - run: ./setup-cli/assert/version.sh $(cat ./setup-cli/VERSION)
        shell: bash

      - run: ./setup-cli/assert/clean.sh
        shell: bash

  tool-cache:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli

      - name: Run offline cache assertions
        run: bash ./setup-cli/assert/tool-cache.sh
        shell: bash

      # First invocation: cache miss, downloads and populates cache.
      - uses: ./setup-cli

      - name: Write sentinel file to cache entry
        run: |
          case "$RUNNER_ARCH" in
            X64) arch="x64" ;;
            ARM64) arch="arm64" ;;
            X86) arch="ia32" ;;
            ARM) arch="arm" ;;
            *) echo "Unknown RUNNER_ARCH: $RUNNER_ARCH"; exit 1 ;;
          esac
          version="$(cat ./setup-cli/VERSION)"
          sentinel="${RUNNER_TOOL_CACHE}/databricks/${version}/${arch}/.sentinel"
          touch "$sentinel"
          echo "Sentinel written to $sentinel"
        shell: bash

      - run: databricks version
        shell: bash

      # Second invocation: should hit the cache.
      - uses: ./setup-cli

      - name: Verify cache was used (no re-download)
        run: |
          case "$RUNNER_ARCH" in
            X64) arch="x64" ;;
            ARM64) arch="arm64" ;;
            X86) arch="ia32" ;;
            ARM) arch="arm" ;;
            *) echo "Unknown RUNNER_ARCH: $RUNNER_ARCH"; exit 1 ;;
          esac
          version="$(cat ./setup-cli/VERSION)"
          marker="${RUNNER_TOOL_CACHE}/databricks/${version}/${arch}.complete"
          sentinel="${RUNNER_TOOL_CACHE}/databricks/${version}/${arch}/.sentinel"

          # Marker must exist (cache was populated on first run).
          if [ ! -f "$marker" ]; then
            echo "ERROR: Cache marker not found at $marker"
            exit 1
          fi

          # Sentinel must still exist (second run did not rm-rf the cache entry).
          if [ ! -f "$sentinel" ]; then
            echo "ERROR: Sentinel file removed; cache entry was re-downloaded"
            exit 1
          fi

          # Binary path must match /databricks/<version>/ format (from cache).
          binary_path=$(which databricks)
          if ! [[ "$binary_path" =~ /databricks/${version}/ ]]; then
            echo "ERROR: Binary path does not match cache format: $binary_path (expected /databricks/${version}/)"
            exit 1
          fi

          echo "Cache verification passed: marker=$marker, sentinel preserved, binary_path=$binary_path"
        shell: bash

      - name: Verify fallback for a read-only stale cache
        if: runner.os != 'Windows'
        run: ./setup-cli/assert/tool-cache-fallback.sh
        shell: bash

      - run: databricks version
        shell: bash

      - run: ./setup-cli/assert/version.sh "$(cat ./setup-cli/VERSION)"
        shell: bash

      - run: ./setup-cli/assert/clean.sh
        shell: bash

  install:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli

      - run: env
        shell: bash

      - name: Assert databricks CLI is not already installed
        run: ./setup-cli/assert/not-installed.sh
        shell: bash

      - run: ./setup-cli/install.sh
        shell: bash

      - run: databricks version
        shell: bash

      - name: Assert the version of the CLI installed
        run: ./setup-cli/assert/version.sh $(cat ./setup-cli/VERSION)
        shell: bash

      - name: Assert installation path is /usr/local/bin for non-windows platforms
        run: ./setup-cli/assert/path.sh /usr/local/bin/databricks
        if: matrix.os != 'windows-latest'
        shell: bash

      - name: Assert installation path is /c/Windows for windows platforms
        if: matrix.os == 'windows-latest'
        run: ./setup-cli/assert/path.sh /c/Windows/databricks


  install-dbr:
    # All DBR images are built on top of Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli

      # When run on DBR, the installation scripts installs the CLI to ~/bin. Add
      # it to $PATH to make assertions work.
      - run: echo "$HOME/bin" >> $GITHUB_PATH

      - name: Assert databricks CLI is not already installed
        run: ./setup-cli/assert/not-installed.sh
        shell: bash

      - name: Install the CLI
        run: ./setup-cli/install.sh
        shell: bash
        env:
          DATABRICKS_RUNTIME_VERSION: value-does-not-matter

      - name: Run the CLI
        run: databricks version
        shell: bash

      - name: Assert the version of the CLI installed
        run: ./setup-cli/assert/version.sh $(cat ./setup-cli/VERSION)
        shell: bash

      - name: Assert installation path is ~/bin
        run: ./setup-cli/assert/path.sh ~/bin/databricks
        shell: bash

  curl:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli

      - name: Assert databricks CLI is not already installed
        run: ./setup-cli/assert/not-installed.sh
        shell: bash

      - run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/${{ github.sha }}/install.sh | sh
        shell: bash

      - run: databricks version
        shell: bash

      - name: Assert the version of the CLI installed
        run: ./setup-cli/assert/version.sh $(cat ./setup-cli/VERSION)
        shell: bash

      - name: Assert installation path is /usr/local/bin for non-windows platforms
        run: ./setup-cli/assert/path.sh /usr/local/bin/databricks
        if: matrix.os != 'windows-latest'
        shell: bash

      - name: Assert installation path is /c/Windows for windows platforms
        if: matrix.os == 'windows-latest'
        run: ./setup-cli/assert/path.sh /c/Windows/databricks

  curl-dbr:
    # All DBR images are built on top of Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli

      # When run on DBR, the installation scripts installs the CLI to ~/bin. Add
      # it to $PATH to make assertions work.
      - run: echo "$HOME/bin" >> $GITHUB_PATH

      - name: Assert databricks CLI is not already installed
        run: ./setup-cli/assert/not-installed.sh
        shell: bash

      - run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/${{ github.sha }}/install.sh | sh
        shell: bash
        env:
          DATABRICKS_RUNTIME_VERSION: value-does-not-matter

      - run: databricks version
        shell: bash

      - name: Assert the version of the CLI installed
        run: ./setup-cli/assert/version.sh $(cat ./setup-cli/VERSION)
        shell: bash

      - name: Assert installation path is ~/bin
        run: ./setup-cli/assert/path.sh ~/bin/databricks
        shell: bash

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./setup-cli

      - name: Install shellcheck
        run: sudo apt-get install shellcheck
        shell: bash

      - name: Run shellcheck
        run: shellcheck ./setup-cli/*.sh
        shell: bash
