name: tag

on:
  # Update tags on every push to main.
  push:
    branches:
      - main

  # To allow for manual testing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag and release new versions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Walk commits that touched VERSION in chronological order so each
          # release's auto-generated notes diff against the previous release.
          commits=$(git log --reverse --pretty=format:"%H" ./VERSION)
          for commit in $commits; do
              version=$(git show "$commit:./VERSION")
              tag="v${version}"

              # `gh release create` creates the tag if it doesn't exist, so we
              # gate purely on release existence. This makes the workflow
              # idempotent and self-healing: a partial failure (tag pushed but
              # release creation failed) is reconciled on the next run, and
              # pre-existing tags without a release are backfilled.
              if gh release view "$tag" >/dev/null 2>&1; then
                  continue
              fi

              echo "Creating release $tag at $commit"
              gh release create "$tag" \
                  --title "$tag" \
                  --generate-notes \
                  --target "$commit"
          done
